<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="600" height="400" fill="#f8f9fa"/>
    
    <!-- Book -->
    <g transform="translate(100, 100)">
        <!-- Book body -->
        <rect x="0" y="0" width="200" height="250" fill="#0d6efd" rx="10"/>
        <rect x="10" y="10" width="180" height="230" fill="#ffffff" rx="5"/>
        
        <!-- Pages -->
        <rect x="20" y="20" width="160" height="210" fill="#f8f9fa" rx="3"/>
        <rect x="30" y="30" width="140" height="190" fill="#ffffff" rx="2"/>
        
        <!-- Lines representing text -->
        <g fill="#0d6efd" opacity="0.3">
            <rect x="40" y="40" width="120" height="4" rx="2"/>
            <rect x="40" y="60" width="100" height="4" rx="2"/>
            <rect x="40" y="80" width="110" height="4" rx="2"/>
            <rect x="40" y="100" width="90" height="4" rx="2"/>
            <rect x="40" y="120" width="105" height="4" rx="2"/>
        </g>
    </g>
    
    <!-- Graduation cap -->
    <g transform="translate(350, 100)">
        <!-- Cap body -->
        <path d="M0,0 L100,0 L50,-50 Z" fill="#0d6efd"/>
        <rect x="20" y="0" width="60" height="20" fill="#0d6efd"/>
        
        <!-- Tassel -->
        <circle cx="50" cy="20" r="5" fill="#0d6efd"/>
        <path d="M50,25 L50,35 L45,30 L50,35 L55,30 Z" fill="#0d6efd"/>
    </g>
    
    <!-- Decorative elements -->
    <g fill="#0d6efd" opacity="0.1">
        <circle cx="50" cy="50" r="30"/>
        <circle cx="550" cy="350" r="40"/>
        <circle cx="300" cy="200" r="25"/>
    </g>
</svg> 